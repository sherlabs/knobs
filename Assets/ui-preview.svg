<svg xmlns="http://www.w3.org/2000/svg" width="660" height="760" viewBox="0 0 330 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1450"/><stop offset="1" stop-color="#4073d9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f6bd6" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#b080e8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5fd0f0" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="track" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset="1" stop-color="#3b82f6" stop-opacity=".65"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".3"/></filter>
  </defs>
  <rect width="330" height="380" fill="url(#bg)"/>
  <circle cx="60" cy="320" r="70" fill="#a855f7" opacity=".5" filter="url(#blur)"/>
  <circle cx="290" cy="60" r="60" fill="#22d3ee" opacity=".45" filter="url(#blur)"/>

  <!-- glass popover -->
  <rect x="40" y="30" width="250" height="320" rx="22" fill="#ffffff" fill-opacity=".14"/>
  <rect x="40" y="30" width="250" height="320" rx="22" fill="url(#panel)"/>
  <rect x="40.5" y="30.5" width="249" height="319" rx="22" fill="none" stroke="#fff" stroke-opacity=".3"/>

  <!-- orb -->
  <circle cx="165" cy="110" r="60" fill="url(#glow)"/>
  <circle cx="165" cy="110" r="38" fill="#ffffff" fill-opacity=".22" stroke="url(#rim)" filter="url(#sh)"/>
  <text x="165" y="124" font-size="38" text-anchor="middle" fill="#fff" font-family="-apple-system, Helvetica">&#63743;</text>

  <text x="165" y="198" font-size="15" font-weight="600" text-anchor="middle" fill="#fff" font-family="-apple-system, Helvetica">Logo Light</text>
  <text x="165" y="216" font-size="12" text-anchor="middle" fill="#fff" fill-opacity=".65" font-family="-apple-system, Helvetica">Illuminated</text>

  <!-- toggle -->
  <rect x="117" y="232" width="96" height="44" rx="22" fill="url(#track)"/>
  <rect x="117.5" y="232.5" width="95" height="43" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
  <circle cx="191" cy="254" r="18" fill="#fff" filter="url(#sh)"/>

  <line x1="60" y1="304" x2="270" y2="304" stroke="#fff" stroke-opacity=".2"/>
  <text x="60" y="328" font-size="11" fill="#fff" fill-opacity=".5" font-family="-apple-system, Helvetica">Admin approval required</text>
  <text x="270" y="328" font-size="11" font-weight="500" text-anchor="end" fill="#fff" fill-opacity=".7" font-family="-apple-system, Helvetica">Quit</text>
</svg>
